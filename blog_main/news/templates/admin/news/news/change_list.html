{% extends "admin/change_list.html" %}
{# added by shubham - "Fetch latest news" button on the News admin list #}
{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'news:refresh' %}" style="display:inline">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="button" style="padding:4px 12px;cursor:pointer">Fetch latest news from GNews</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
