{% extends "registration/auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">
  {% csrf_token %}
  {% include "registration/_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
<p class="alt">New here? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
